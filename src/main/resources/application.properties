# Nome da aplicação e porta do servidor
spring.application.name=ecovolt-os
server.port=8080

# Configuração do Banco de Dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:ecovoltdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o painel visual do banco no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do JPA / Hibernate (cria e atualiza as tabelas automaticamente)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa cache do Thymeleaf para refletir alterações no HTML imediatamente
spring.thymeleaf.cache=false