<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mecânicos')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Equipe Técnica (Mecânicos)</h2>
        <a th:href="@{/mecanicos/novo}" class="btn btn-success">+ Novo Mecânico</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Especialidade</th>
                        <th>Telefone</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${mecanicos}">
                        <td th:text="${m.id}">1</td>
                        <td class="fw-semibold" th:text="${m.nome}">Carlos Souza</td>
                        <td th:text="${m.especialidade}">Baterias de Lítio e Controladoras</td>
                        <td th:text="${m.telefone}">(27) 98888-0000</td>
                        <td class="text-end">
                            <a th:href="@{/mecanicos/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <a th:href="@{/mecanicos/excluir/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Excluir este mecânico?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(mecanicos)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum mecânico cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
