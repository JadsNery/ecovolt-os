<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Cliente')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 650px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold"
             th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'">Cliente</div>
        <div class="card-body">
            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" th:field="*{nome}" required />
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telefone *</label>
                        <input type="text" class="form-control" th:field="*{telefone}" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">E-mail *</label>
                        <input type="email" class="form-control" th:field="*{email}" required />
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Endereço *</label>
                    <input type="text" class="form-control" th:field="*{endereco}" required />
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
