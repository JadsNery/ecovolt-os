<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Clientes Cadastrados</h2>
        <a th:href="@{/clientes/novo}" class="btn btn-success">+ Novo Cliente</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                        <th>Endereço</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.id}">1</td>
                        <td class="fw-semibold" th:text="${c.nome}">João Silva</td>
                        <td th:text="${c.telefone}">(27) 99999-0000</td>
                        <td th:text="${c.email}">joao@email.com</td>
                        <td th:text="${c.endereco}">Rua A, 123</td>
                        <td class="text-end">
                            <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <a th:href="@{/clientes/excluir/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Excluir este cliente?')">Excluir</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhum cliente cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
