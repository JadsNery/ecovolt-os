<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - EcoVolt OS'">EcoVolt OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">⚡ EcoVolt OS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Painel</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ordens}">Ordens de Serviço</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bicicletas}">Bicicletas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pecas}">Estoque de Peças</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/mecanicos}">Mecânicos</a></li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
    <small>EcoVolt OS &copy; 2026 - Gestão de Oficina de Bicicletas Elétricas</small>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
